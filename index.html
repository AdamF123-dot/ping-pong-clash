<!doctype html>
<html lang="pl">
<head><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png?v=2"><link rel="icon" type="image/png" href="icon-192.png?v=2"><meta name="theme-color" content="#10243a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Ping-Pong">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ping-Pong Clash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Układ: nagłówek, zakładki (na dole na telefonie, na górze na komputerze), jedna kolumna treści.
   Kolory ze stołu: granat, biała linia, pomarańczowa piłeczka. */
:root{
  --bg:#e9f0f7; --surface:#ffffff; --surface2:#f1f6fb; --ink:#10243a; --muted:#566b82; --line:#d2deea;
  --pa:#1b6ca8; --pb:#b9440c; --ball:#ff7a1a; --on-ball:#2a1200;
  --good:#17804f; --bad:#b8324b; --gold:#f2b705; --focus:#ff7a1a;
  --font-d:'Fredoka',system-ui,sans-serif; --font-b:'Nunito',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1724; --surface:#132a3f; --surface2:#1a3550; --ink:#e8f1fa; --muted:#94aac0; --line:#27435c;
  --pa:#1e639a; --pb:#a53b0b; --good:#43d393; --bad:#ff8397; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1724; --surface:#132a3f; --surface2:#1a3550; --ink:#e8f1fa; --muted:#94aac0; --line:#27435c;
  --pa:#1e639a; --pb:#a53b0b; --good:#43d393; --bad:#ff8397; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.45 var(--font-b);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-block:16px 104px}
h1,h2,h3{font-family:var(--font-d);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.1px}
h2{font-size:1.5rem} h3{font-size:1.1rem}
p{margin:0}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* nagłówek */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{width:44px;height:44px;flex:none}
.brand h1{font-size:1.45rem;line-height:1.1}
.brand p{font-size:.85rem;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 11px;font-size:.78rem;font-weight:800;color:var(--muted)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.chip.shared i{background:var(--good)}
.chip.t{color:var(--ink);background:var(--surface2)}

/* nawigacja */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(6,1fr);gap:2px;
  background:var(--surface);border-top:1.5px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav button{background:none;border:0;border-radius:12px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:.72rem;font-weight:800;color:var(--muted);cursor:pointer}
.nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--ink);background:color-mix(in srgb,var(--ball) 24%,var(--surface))}
.nav .dot{position:relative}
.nav .dot::after{content:"";position:absolute;top:-2px;right:-5px;width:9px;height:9px;border-radius:50%;background:var(--ball);border:2px solid var(--surface)}
@media (min-width:760px){
  .nav{position:static;display:flex;gap:6px;background:none;border:0;padding:0 0 18px}
  .nav button{flex-direction:row;gap:8px;padding:9px 16px;font-size:.95rem;background:var(--surface);border:1.5px solid var(--line);border-radius:99px}
  .nav svg{width:20px;height:20px}
  .wrap{padding-bottom:40px}
}

/* karty i przyciski */
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:13px;padding:11px 18px;font-weight:800;cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--ball);border-color:var(--ball);color:var(--on-ball);font-family:var(--font-d);font-size:1.1rem;font-weight:600;padding:12px 24px}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{min-height:36px;padding:6px 14px;font-size:.9rem}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.danger.ask{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.lbl{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:8px;display:block}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--surface2);border-radius:11px;padding:8px 14px;font-weight:800;cursor:pointer;min-height:40px}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{text-align:center;padding:28px 16px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty p{max-width:42ch;color:var(--muted)}

/* awatary */
.av{display:block;width:100%;height:auto}
.avb{--s:48px;width:var(--s);height:var(--s);border-radius:50%;overflow:hidden;flex:none;display:inline-block;
  background:color-mix(in srgb,var(--surface2) 80%,var(--ball) 12%);border:2px solid var(--line)}
.avf{width:var(--w,160px);max-width:100%}

/* wybór graczy */
.pick{display:flex;gap:8px;flex-wrap:wrap}
.pk{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--surface2);border-radius:14px;padding:6px 14px 6px 6px;cursor:pointer;font-weight:800;min-height:52px}
.pk.on.a{border-color:var(--pa);background:color-mix(in srgb,var(--pa) 22%,var(--surface))}
.pk.on.b{border-color:var(--pb);background:color-mix(in srgb,var(--pb) 22%,var(--surface))}
.pk.on.t{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--surface))}
.pk:disabled{opacity:.4;cursor:not-allowed}
.vs{font-family:var(--font-d);font-size:1.6rem;color:var(--muted);align-self:center}

/* mecz na żywo */
.live{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pnl{border:0;border-radius:24px;color:#fff;cursor:pointer;min-height:min(56vh,430px);display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:14px 8px 16px;text-align:center;transition:transform .08s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.pnl:active:not(:disabled){transform:scale(.985)}
.pnl.a{background:var(--pa)} .pnl.b{background:var(--pb)}
.pnl:disabled{cursor:default;filter:saturate(.7) brightness(.85)}
.pnl .avb{--s:clamp(70px,22vw,110px);border-color:rgba(255,255,255,.55);background:rgba(255,255,255,.2)}
.pnl .nm{font-family:var(--font-d);font-size:clamp(1.1rem,4.4vw,1.6rem);font-weight:600;line-height:1.1;overflow-wrap:anywhere}
.pnl .sc{font-family:var(--font-d);font-weight:600;font-size:clamp(5rem,26vw,10.5rem);line-height:.95;font-variant-numeric:tabular-nums}
.pnl .srv{display:flex;align-items:center;gap:6px;font-weight:800;font-size:.85rem;min-height:26px;background:rgba(0,0,0,.22);border-radius:99px;padding:2px 12px 2px 6px}
.pnl .srv.off{visibility:hidden}
.pnl .srv svg{width:18px;height:18px}
.pnl .sets{display:flex;gap:6px;min-height:14px}
.pnl .sets i{width:14px;height:14px;border-radius:50%;border:2.5px solid rgba(255,255,255,.8)}
.pnl .sets i.f{background:#fff}
.stripe{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:12px}
.sc-chip{font-family:var(--font-d);font-weight:500;background:var(--surface);border:1.5px solid var(--line);border-radius:99px;padding:2px 12px}
.sc-chip.a{border-color:var(--pa)} .sc-chip.b{border-color:var(--pb)}
.banner{margin-top:12px;border-radius:14px;padding:10px 14px;background:color-mix(in srgb,var(--gold) 30%,var(--surface));border:1.5px solid var(--gold);font-weight:800;text-align:center}
.ctl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.result{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:12px;justify-content:center;text-align:center}
.result h2{font-size:1.7rem}

/* tabele */
.tw{overflow-x:auto;border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:700px}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;padding:8px 6px;font-weight:800;white-space:nowrap}
td{padding:9px 6px;text-align:center;border-top:1.5px solid var(--line);font-variant-numeric:tabular-nums}
th:nth-child(2),td:nth-child(2){text-align:left}
td.who{display:flex;align-items:center;gap:10px;font-weight:800;border-top:1.5px solid var(--line)}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden;min-width:44px;margin-top:3px}
.bar i{display:block;height:100%;background:var(--good)}
.form{display:inline-flex;gap:3px}
.form b{width:20px;height:20px;border-radius:6px;font-size:.7rem;display:grid;place-items:center;color:#fff}
.form .w{background:var(--good)} .form .l{background:var(--bad)}
.rank1{font-family:var(--font-d);font-size:1.1rem}
.recs{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.rec{background:var(--surface2);border:1.5px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.rec .big{font-family:var(--font-d);font-size:1.9rem;font-weight:600;line-height:1}
.rec .who2{display:flex;align-items:center;gap:8px;font-weight:800}
select{background:var(--surface2);border:1.5px solid var(--line);border-radius:11px;padding:8px 10px;min-height:40px;max-width:100%}
.h2h{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center;margin-top:12px}
.h2h .big{font-family:var(--font-d);font-size:3rem;font-weight:600;line-height:1}
.h2h .side{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800}

/* historia */
.day{font-family:var(--font-d);font-size:1.05rem;margin:6px 0 8px}
.day::first-letter{text-transform:uppercase}
.mrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 14px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px}
.mrow + .mrow{margin-top:8px}
.mp{display:flex;align-items:center;gap:8px;min-width:0;font-weight:800}
.mp span{overflow-wrap:anywhere}
.mp.win{color:var(--good)}
.mp .avb{--s:36px}
.msc{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.msc span{font-family:var(--font-d);background:var(--surface2);border-radius:8px;padding:0 8px;font-size:.92rem}
.mmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-top:4px}
.mbig{font-family:var(--font-d);font-size:1.8rem;font-weight:600;white-space:nowrap}

/* drabinka */
.bracket{display:flex;gap:18px;overflow-x:auto;padding:4px 2px 12px}
.col{display:flex;flex-direction:column;justify-content:space-around;gap:12px;min-width:220px;flex:1}
.col h3{text-align:center;font-size:.9rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-family:var(--font-b);font-weight:800}
.col .ms{display:flex;flex-direction:column;justify-content:space-around;gap:14px;flex:1}
.bm{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.bm.play{border-color:var(--ball);box-shadow:0 0 0 3px color-mix(in srgb,var(--ball) 25%,transparent)}
.bp{display:flex;align-items:center;gap:8px;padding:7px 10px;min-height:46px}
.bp + .bp{border-top:1.5px solid var(--line)}
.bp .avb{--s:30px}
.bp .n{flex:1;min-width:0;font-weight:800;overflow-wrap:anywhere;line-height:1.15}
.bp .s{font-family:var(--font-d);font-weight:600;font-size:1.1rem}
.bp.win{background:color-mix(in srgb,var(--good) 15%,var(--surface))}
.bp.win .n{color:var(--good)}
.bp.wait .n{color:var(--muted);font-weight:700;font-style:italic}
.bm .go{padding:8px;background:var(--surface2);border-top:1.5px solid var(--line);display:flex;justify-content:center}
.champ{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center;text-align:center;
  background:linear-gradient(135deg,color-mix(in srgb,var(--gold) 30%,var(--surface)),var(--surface));border-color:var(--gold)}
.champ h2{font-size:1.9rem}

/* gracze */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pcard{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;text-align:center;font-weight:800}
.pcard:hover{border-color:var(--ball)}
.pcard .avf{--w:110px}
.pcard small{color:var(--muted);font-weight:700}
.pcard{position:relative;cursor:default}
.pmain{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-weight:800;width:100%;text-align:center}
.spl{display:flex;gap:8px;flex-wrap:wrap}
.spl button{background:var(--surface2);border:2px solid var(--line);border-radius:14px;padding:6px 12px 6px 6px;display:flex;align-items:center;gap:8px;cursor:pointer;text-align:left;font-weight:800}
.spl button.on{border-color:var(--ball);background:color-mix(in srgb,var(--ball) 16%,var(--surface))}
.spl small{display:flex;align-items:center;gap:3px;color:var(--muted);font-weight:700;margin-left:2px}
.spl b{display:block}
.coin{vertical-align:-3px}
.bal{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-d);font-size:1.4rem;font-weight:600}
.boxes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
.box{background:var(--surface2);border:2px solid color-mix(in srgb,var(--bc) 55%,var(--line));border-radius:16px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.box small{font-size:.72rem;font-weight:700;line-height:1.35}
.box .bxi{filter:drop-shadow(0 0 7px color-mix(in srgb,var(--bc) 70%,transparent))}
.box .btn{display:flex;align-items:center;gap:5px;justify-content:center;width:100%;margin-top:2px}
.coll{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.ci{background:var(--surface2);border:2px solid var(--rc);border-radius:12px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-weight:700}
.ci small{font-size:.66rem;line-height:1.1;text-align:center;color:var(--muted)}
.ci .cs{width:40px;height:40px;border-radius:50%;border:2px solid rgba(0,0,0,.25)}
.rv{position:fixed;inset:0;z-index:60;background:rgba(6,16,28,.82);display:flex;align-items:center;justify-content:center;padding:16px}
.rvc{background:var(--surface);border:3px solid var(--rc);border-radius:22px;padding:22px 18px;text-align:center;max-width:360px;width:100%;box-shadow:0 0 40px color-mix(in srgb,var(--rc) 60%,transparent);display:flex;flex-direction:column;align-items:center;gap:8px}
.rvc.open{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.rvr{font-family:var(--font-d);font-size:1.5rem;font-weight:600;letter-spacing:.12em}
.rvt{font-weight:800;color:var(--muted)}
.shk{filter:drop-shadow(0 0 14px var(--glow));animation:shk .28s linear infinite}
@keyframes shk{0%,100%{transform:rotate(-6deg) translateX(-3px)}50%{transform:rotate(6deg) translateX(3px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.shk,.rvc.open{animation:none}}
.trash{position:absolute;top:8px;right:8px;min-width:34px;height:34px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface2);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 8px;color:var(--muted)}
.trash svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.trash:hover{color:var(--bad);border-color:var(--bad)}
.trash.ask{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:800;font-size:.8rem}
.lvl{display:flex;flex-direction:column;gap:8px}
.pbar{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ball),#ffc247)}
.medals{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.medal{background:var(--surface2);border:1.5px solid var(--line);border-radius:14px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.medal b{font-size:.88rem;line-height:1.15}
.medal span{font-size:.75rem;color:var(--muted);line-height:1.2}
.medal.off b{color:var(--muted)}
.tile{position:relative}
.tile.lock{cursor:not-allowed}
.tile:disabled{color:inherit}
.tile.lock .avb{filter:grayscale(1) brightness(.85);opacity:.55}
.tile .lk{position:absolute;left:2px;right:2px;bottom:2px;border-radius:8px;background:rgba(16,36,58,.82);color:#fff;font-size:.68rem;font-weight:800;text-align:center;padding:1px 0}
.sw button.lock{position:relative;opacity:.5;cursor:not-allowed}
.sw button.lock::after{content:'\1F512';font-size:0}
.pcard.add{justify-content:center;border-style:dashed;min-height:180px;color:var(--muted)}
.pcard.add b{font-family:var(--font-d);font-size:2.6rem;line-height:1;color:var(--ball)}
.editor{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:760px){.editor{grid-template-columns:260px 1fr;align-items:start}.ed-prev{position:sticky;top:12px}}
.ed-prev{display:flex;flex-direction:column;align-items:center;gap:12px}
.ed-prev .avf{--w:200px;background:color-mix(in srgb,var(--surface2) 80%,var(--ball) 12%);border-radius:50% 50% 24px 24px;padding:8px 20px 0}
.ed-prev input{width:100%;border:2px solid var(--line);background:var(--surface2);border-radius:13px;padding:10px 14px;font-weight:800;font-size:1.1rem;text-align:center}
.tiles{display:flex;gap:8px;flex-wrap:wrap}
.tile{border:2.5px solid var(--line);background:var(--surface2);border-radius:14px;padding:2px;cursor:pointer;--s:58px;width:66px}
.tile .avb{--s:58px;border:0;display:block;width:100%;height:auto;aspect-ratio:1}
.tile.on{border-color:var(--ball);background:color-mix(in srgb,var(--ball) 22%,var(--surface))}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:34px;height:34px;border-radius:50%;border:2px solid rgba(0,0,0,.25);cursor:pointer;padding:0}
.sw button.on{outline:3px solid var(--ink);outline-offset:2px}
.grp + .grp{margin-top:14px}

#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--bg);border-radius:13px;padding:10px 16px;font-weight:800;z-index:40;max-width:min(92vw,420px);text-align:center;transition:.2s}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (min-width:760px){#toast{bottom:28px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.lnk{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;font-weight:800;cursor:pointer;text-align:left}
.lnk:hover span{text-decoration:underline}
.btn svg.mic{width:20px;height:20px;vertical-align:-4px;margin-right:6px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.tog.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.voice{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.voice .msg{min-height:1.5em;font-size:.92rem}
.live-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bad);margin-right:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface2);border:1.5px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stat .sl{font-size:.8rem;font-weight:800;color:var(--muted)}
.stat .sv{font-family:var(--font-d);font-size:2.1rem;font-weight:600;line-height:1.1}
.stat .ss{font-size:.8rem;color:var(--muted)}
.stat.good .sv{color:var(--good)} .stat.bad .sv{color:var(--bad)}
.phead{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
</style>

/* ---------- stan i zapis ---------- */
const COLL=['players','matches','tournaments'];
const S={players:{},matches:{},tournaments:{},tomb:{players:{},matches:{},tournaments:{}},sync:{ok:true,last:0,err:''},mode:'local',loading:false};
const ui={tab:lsGet('tt-tab','play'),setup:lsGet('tt-setup',{a:null,b:null,to:11,bo:3,first:'rnd'}),live:lsGet('tt-live',null),
  edit:null,prof:null,showLink:false,voice:Object.assign({speak:false},lsGet('tt-voice',{}),{listen:false}),voiceMsg:'',confirm:null,tsetup:{sel:[],bo:3,finalBo:5,to:11,name:''},tview:null,h2h:{a:'',b:''},hf:'',period:'all'};
const saveUi=()=>{lsSet('tt-tab',ui.tab);lsSet('tt-setup',ui.setup);lsSet('tt-live',ui.live)};
const saveVoice=()=>lsSet('tt-voice',{speak:!!ui.voice.speak});
function loadLocal(){
  const d=lsGet('tt-data',{});COLL.forEach(c=>S[c]=d[c]||{});
  S.tomb=d.tomb||{};COLL.forEach(c=>{S.tomb[c]=S.tomb[c]||{}})}
function saveLocal(){lsSet('tt-data',{players:S.players,matches:S.matches,tournaments:S.tournaments,tomb:S.tomb})}
async function put(c,id,obj){obj.u=Date.now();S[c][id]=obj;delete S.tomb[c][id];saveLocal();render();syncSoon()}
async function del(c,id){delete S[c][id];S.tomb[c][id]=Date.now();saveLocal();render();syncSoon()}

/* ---------- synchronizacja między urządzeniami (Firebase Realtime Database, REST) ---------- */
const SYNC_RE=/^https:\/\/[a-z0-9-]+(\.[a-z0-9-]+)*\.(firebaseio\.com|firebasedatabase\.app)$/i;
let syncInt=null;
let sync=lsGet('tt-sync',null),syncBusy=false,syncAgain=false,syncT=null;
const syncUrl=p=>`${sync.db}/pp/${sync.room}${p||''}.json`;
function chip(){
  const on=!!sync,ok=S.sync.ok;
  const cls=on&&ok?'shared':'local',txt=!on?'Tylko to urządzenie':ok?'Synchronizacja włączona':'Brak połączenia z bazą';
  const tt=!on?'Dane są tylko w tej przeglądarce':ok?'Dane są wspólne dla urządzeń z tym samym kodem':'Dane zapiszą się na telefonie i wyślą, gdy wróci połączenie';
  return`<span id="chip" class="chip ${cls}" title="${tt}"><i></i>${txt}</span>`}
function updateChip(){const e=$('#chip');if(e)e.outerHTML=chip()}
function syncSoon(){if(!sync)return;clearTimeout(syncT);syncT=setTimeout(syncNow,700)}
function syncRender(){
  if(ui.edit||(ui.shop&&ui.shop.reveal)||(ui.live&&ui.tab==='play'))return;
  const a=document.activeElement;if(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))return;
  render()}
async function syncNow(){
  if(!sync)return;if(syncBusy){syncAgain=true;return}
  syncBusy=true;
  try{
    let touched=false;
    COLL.forEach(c=>Object.values(S[c]).forEach(r=>{if(!r.u){r.u=Date.now();touched=true}}));
    const r=await fetch(syncUrl(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);
    const remote=(await r.json())||{};
    let changed=false;const push=[];
    COLL.forEach(c=>{
      const rc=remote[c]||{};
      new Set([...Object.keys(rc),...Object.keys(S[c]),...Object.keys(S.tomb[c])]).forEach(id=>{
        const rr=rc[id],ru=rr?(rr.u||0):0,rdel=!!(rr&&rr.del);
        const l=S[c][id],lu=l?(l.u||0):0,t=S.tomb[c][id]||0,ldel=t>0&&t>=lu,lv=ldel?t:lu;
        if(ru>lv){
          if(rdel){if(l){delete S[c][id]}S.tomb[c][id]=ru}else{S[c][id]=rr;delete S.tomb[c][id]}
          changed=true}
        else if(lv>ru)push.push([c,id,ldel?{del:1,u:t}:l])})});
    for(let i=0;i<push.length;i+=10){
      await Promise.all(push.slice(i,i+10).map(([c,id,v])=>fetch(syncUrl('/'+c+'/'+id),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(v)}).then(x=>{if(!x.ok)throw new Error('HTTP '+x.status)})))}
    if(changed||touched)saveLocal();
    S.sync={ok:true,last:Date.now(),err:''};
    if(changed)syncRender()}
  catch(e){S.sync.ok=false;S.sync.err=String(e&&e.message||e)}
  finally{syncBusy=false;updateChip();if(syncAgain){syncAgain=false;syncSoon()}}}
function startPoll(){if(!syncInt)syncInt=setInterval(()=>{if(sync&&!document.hidden)syncNow()},8000)}
function initStore(){
  loadLocal();S.loading=false;
  try{const q=new URLSearchParams(location.search),db=q.get('db'),room=q.get('room');
    if(db&&room&&SYNC_RE.test(db)&&/^[a-z0-9]{8,40}$/i.test(room)){
      sync={db,room};lsSet('tt-sync',sync);history.replaceState(null,'',location.pathname);toast('Dołączono do synchronizacji.')}}catch(e){}
  render();
  if(sync){syncNow();startPoll()}
  document.addEventListener('visibilitychange',()=>{if(sync&&!document.hidden)syncNow()})}
async function enableSync(){
  const inp=$('#sync-url');let db=(inp&&inp.value||'').trim().replace(/\/+$/,'');
  if(!SYNC_RE.test(db)){toast('Adres bazy powinien zaczynać się od https:// i kończyć na firebasedatabase.app lub firebaseio.com.');return}
  const typed=(($('#sync-code')||{}).value||'').trim().toLowerCase();
  if(typed&&!/^[a-z0-9]{8,40}$/.test(typed)){toast('Kod rodziny to 8-40 liter i cyfr, bez spacji.');return}
  const room=typed||Array.from({length:20},()=>'abcdefghijkmnpqrstuvwxyz23456789'[rint(32)]).join('');
  sync={db,room};
  try{const r=await fetch(syncUrl(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status)}
  catch(e){sync=null;toast('Nie mogę połączyć się z bazą. Sprawdź adres i reguły (zakładka Rules).');return}
  lsSet('tt-sync',sync);S.sync={ok:true,last:0,err:''};
  await syncNow();startPoll();
  toast('Synchronizacja włączona.');render()}
const joinLink=()=>`${location.origin}${location.pathname}?db=${encodeURIComponent(sync.db)}&room=${sync.room}`;
function syncCard(){
  if(sync){
    return`<section class="card stack"><h3>Synchronizacja między telefonami</h3>
     <p>${S.sync.ok?'Włączona. Gracze, mecze i turnieje są wspólne dla wszystkich urządzeń z tym samym linkiem.':'Brak połączenia z bazą ('+esc(S.sync.err)+'). Zapisy zostają na telefonie i wyślą się, gdy połączenie wróci.'}</p>
     ${S.sync.last?`<p class="muted">Ostatnia synchronizacja: ${fmtTime(S.sync.last)}</p>`:''}
     <div class="rec"><span class="muted" style="font-weight:800;font-size:.85rem">Kod rodziny (musi być taki sam na wszystkich telefonach)</span><span class="num" style="font-family:var(--font-d);font-size:1.25rem;letter-spacing:.04em;overflow-wrap:anywhere">${esc(sync.room)}</span></div>

const other=x=>x==='A'?'B':'A';
function score(s){let a=0,b=0;for(const ch of s){ch==='A'?a++:b++}return{a,b}}

function derive(L){
  const need=(L.bo+1)/2;let wa=0,wb=0;L.sets.forEach(s=>{setWinner(s,L.to)==='A'?wa++:wb++});

  const idx=L.sets.length,fs=idx%2===0?L.first:other(L.first),n=sc.a+sc.b,every=L.to>=21?5:2,m=2*(L.to-1);
  const turns=n<m?Math.floor(n/every):Math.floor(m/every)+(n-m);

const norm=s=>String(s).toLowerCase().replace(/ł/g,'l').normalize('NFD').replace(/[̀-ͯ]/g,'');

  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}
function interpret(text,L){

  if(words.some(w=>w==='cofnij'||w==='cofnac'||w==='pomylka'))return'undo';
  const hit=new Set();
  [['A',L.a],['B',L.b]].forEach(([s,id])=>{
    const n=norm(nm(id)).split(/[^a-z0-9]+/)[0];if(!n)return;
    const stem=n.endsWith('a')?n.slice(0,-1):n.length>=5?n.slice(0,-2):n;
    if(words.some(w=>w.length>=2&&((w.startsWith(stem)&&w.length<=n.length+3)||(n.length>=5&&lev(w,n)<=1))))hit.add(s)});

function handleSpeech(alts){

  return`<svg viewBox="0 0 48 48" width="${size||56}" height="${size||56}" aria-hidden="true" style="opacity:${earned?1:.55}"><path d="M15 1l9 15 9-15z" fill="${earned?'#d62828':'#b7c0c9'}"/><circle cx="24" cy="29" r="17" fill="${col}" stroke="rgba(0,0,0,.28)" stroke-width="2"/><circle cx="24" cy="29" r="13.500" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.500"/><g transform="translate(0 1)">${gl}</g></svg>`}
function computeProgress(){
  const list=Object.values(S.matches).sort((a,b)=>a.t.localeCompare(b.t));
  const rows=computeStats(list).rows,X={};
  rows.forEach(r=>{X[r.id]=Object.assign({},r,{bagel:0,deuce:0,comeback:0,days:new Set(),beat:new Set()})});
  list.forEach(m=>['A','B'].forEach(side=>{
    const id=side==='A'?m.a:m.b,x=X[id];if(!x)return;
    const opp=side==='A'?m.b:m.a,won=m.w===id;
    x.days.add(new Date(m.t).toLocaleDateString('sv'));if(won)x.beat.add(opp);
    (m.sets||[]).forEach(st=>{const sc=score(st),me=side==='A'?sc.a:sc.b,th=side==='A'?sc.b:sc.a;
      if(me>th){if(th===0)x.bagel++;if(me>m.to)x.deuce++}});
    if(won&&(m.sets||[]).length>1){const f=score(m.sets[0]);if(side==='A'?f.a<f.b:f.b<f.a)x.comeback++}}));
  const n=rows.length;
  Object.values(X).forEach(x=>{x.earned=x.sw*COIN.set+x.w*COIN.match+x.titles*COIN.title;x.coins=x.earned-((S.players[x.id]||{}).spent||0);x.medals=MEDALS.filter(md=>md.t(x,n)).map(md=>md.id);x.level=1+Math.floor(x.pf/1000)});
  return X}
const plural=(n,a,b,c)=>n===1?a:(n%10>=2&&n%10<=4&&(n%100<10||n%100>=20))?b:c;
function progressNote(before,after,ids){
  const out=[];
  ids.forEach(id=>{
    const b=before[id],a=after[id];if(!a)return;const name=nm(id);
    if(b&&a.level>b.level){const open=UNLOCKS.filter(u=>u[2]>b.pf&&u[2]<=a.pf).length;
      out.push(`${name} awansuje na poziom ${a.level}${open?` i odblokowuje ${open} ${plural(open,'nowy element','nowe elementy','nowych elementów')}`:''}`)}
    const newM=a.medals.filter(m=>!b||!b.medals.includes(m));
    newM.forEach(mid=>{const md=MEDALS.find(q=>q.id===mid);out.push(`${name} zdobywa medal: ${md.n}`)})});
  return out}
function computeStats(list){
  const P={};Object.keys(S.players).forEach(id=>P[id]={id,g:0,w:0,l:0,sw:0,sl:0,pf:0,pa:0,streak:0,best:0,run:0,form:[],titles:0});
  const rec={streak:null,run:null,setDiff:null,long:null};
  list.slice().sort((x,y)=>x.t.localeCompare(y.t)).forEach(m=>{
    const sw=setsWon(m),tot=(m.sets||[]).reduce((n,s)=>n+s.length,0);
    if(tot&&(!rec.long||tot>rec.long.v))rec.long={v:tot,m};
    (m.sets||[]).forEach(s=>{const x=score(s),d=Math.abs(x.a-x.b);
      if(!rec.setDiff||d>rec.setDiff.v||(d===rec.setDiff.v&&Math.max(x.a,x.b)>rec.setDiff.mx))rec.setDiff={v:d,mx:Math.max(x.a,x.b),id:x.a>x.b?m.a:m.b,s:Math.max(x.a,x.b)+':'+Math.min(x.a,x.b)}});
    ['A','B'].forEach(side=>{
      const id=side==='A'?m.a:m.b,p=P[id];if(!p)return;
      const won=m.w===id;p.g++;
      if(won){p.w++;p.streak++;p.best=Math.max(p.best,p.streak)}else{p.l++;p.streak=0}
      p.form.push(won);
      sw&&(side==='A'?(p.sw+=sw.a,p.sl+=sw.b):(p.sw+=sw.b,p.sl+=sw.a));
      (m.sets||[]).forEach(s=>{const x=score(s);side==='A'?(p.pf+=x.a,p.pa+=x.b):(p.pf+=x.b,p.pa+=x.a);
        let run=0;for(const ch of s){if(ch===side){run++;p.run=Math.max(p.run,run)}else run=0}})});
  });
  Object.values(S.tournaments).forEach(t=>{if(t.champ&&P[t.champ])P[t.champ].titles++});
  const arr=Object.values(P);
  arr.forEach(p=>{if(p.best&&(!rec.streak||p.best>rec.streak.v))rec.streak={v:p.best,id:p.id};if(p.run&&(!rec.run||p.run>rec.run.v))rec.run={v:p.run,id:p.id}});
  arr.sort((x,y)=>y.w-x.w||(y.g?y.w/y.g:0)-(x.g?x.w/x.g:0)||(y.pf-y.pa)-(x.pf-x.pa)||x.l-y.l);
  return{rows:arr,rec}}

function ask(key,fn){
  if(ui.confirm===key){ui.confirm=null;fn()}
  else{ui.confirm=key;render();setTimeout(()=>{if(ui.confirm===key){ui.confirm=null;render()}},4000)}}
const H={
 tab:d=>{ui.tab=d.v;ui.confirm=null;ui.tview=null;ui.prof=null;if(d.v!=='pl')ui.edit=null;saveUi();render();window.scrollTo(0,0)},
 pick:d=>{ui.setup[d.s]=d.id;saveUi();render()},
 fmt:d=>{ui.setup[d.k]=d.k==='first'?d.v:+d.v;saveUi();render()},
 start:startMatch,
 pt:d=>addPoint(d.s),
 undo,
 flip:()=>{ui.live.flip=!ui.live.flip;saveUi();render()},
 abort:()=>ask('abort',()=>{const t=!!ui.live.tid;stopListen();ui.live=null;saveUi();if(t)ui.tab='tour';render()}),
 save:saveMatch,
 dmatch:d=>ask('dm'+d.id,()=>del('matches',d.id)),
 tsel:d=>{const s=ui.tsetup.sel,i=s.indexOf(d.id);i>=0?s.splice(i,1):s.push(d.id);render()},
 tfmt:d=>{ui.tsetup[d.k]=+d.v;render()},
 tstart:()=>{
   const ts=ui.tsetup;if(ts.sel.length<3)return;
   const t=buildTournament(shuffle(ts.sel),{name:(ts.name||'').trim()||'Turniej '+fmtShort(new Date()),bo:ts.bo,finalBo:ts.finalBo,to:ts.to});
   ts.name='';ts.sel=[];ui.tview=null;put('tournaments',t.id,t);window.scrollTo(0,0)},
 tplay:d=>startTMatch(d.t,+d.r,+d.i),
 tabort:d=>ask('tabort',()=>del('tournaments',d.t)),
 topen:d=>{ui.tview=d.t;render();window.scrollTo(0,0)},
 tback:()=>{ui.tview=null;render()},
 shoppick:d=>{ui.shop.pid=d.id;render()},
 buybox:d=>{
   const box=BOXES.find(b=>b.id===d.id),p=S.players[ui.shop.pid];if(!box||!p)return;
   const pr=computeProgress()[p.id]||{};if((pr.coins||0)<box.p){toast('Za mało monet.');return}
   const it=rollBox(box),inv=(p.inv||[]).slice(),dupe=inv.includes(it.key),refund=dupe?REFUND[it.r]:0;
   if(!dupe)inv.push(it.key);
   ui.shop.reveal={key:it.key,box:box.id,dupe,refund,phase:'shake'};
   put('players',p.id,Object.assign({},p,{inv,spent:(p.spent||0)+box.p-refund}));
   setTimeout(()=>{if(ui.shop&&ui.shop.reveal){ui.shop.reveal.phase='open';render()}},1500)},
 rvclose:()=>{ui.shop.reveal=null;render()},
 rvequip:()=>{const it=ITEMBY[ui.shop.reveal.key];ui.shop.reveal=null;equipItem(it)},
 equip:d=>{const it=ITEMBY[d.k+':'+d.v];if(it)equipItem(it)},
 pnew:()=>{ui.tab='pl';ui.prof=null;ui.edit={id:null,name:'',av:randomAv(0)};render();window.scrollTo(0,0)},
 pedit:d=>{const p=S.players[d.id];ui.edit={id:p.id,name:p.name,av:Object.assign({},DEF,p.av)};render();window.scrollTo(0,0)},
 opt:d=>{ui.edit.av[d.k]=d.n?+d.v:d.v;render()},
 prand:()=>{const id=ui.edit.id,pts=id?((computeProgress()[id]||{}).pf||0):0;ui.edit.av=randomAv(pts);render()},
 pcancel:()=>{ui.edit=null;ui.confirm=null;render()},
 psave:()=>{
   const e=ui.edit,name=e.name.trim();if(!name){toast('Wpisz imię lub ksywkę.');return}
   const id=e.id||uid();put('players',id,Object.assign({},S.players[id]||{},{id,name,av:clone(e.av),created:(S.players[id]&&S.players[id].created)||new Date().toISOString()}));
   ui.edit=null;toast('Zapisano gracza '+name+'.');render()},
 pprofile:d=>{ui.tab='pl';ui.prof=d.id;ui.edit=null;saveUi();render();window.scrollTo(0,0)},
 pback:()=>{ui.prof=null;render();window.scrollTo(0,0)},
 pexport:exportData,
 syncon:enableSync,
 syncnow:async()=>{await syncNow();toast(S.sync.ok?'Zsynchronizowano.':'Brak połączenia z bazą.');render()},
 synccopy:()=>{ui.showLink=true;render();const e=$('#sync-link');if(e){e.focus();e.select();try{navigator.clipboard&&navigator.clipboard.writeText(e.value).then(()=>toast('Link skopiowany.'),()=>{})}catch(x){}}},
 syncoff:()=>ask('syncoff',()=>{sync=null;lsSet('tt-sync',null);ui.showLink=false;render()}),
 vlisten:()=>{ui.voice.listen?(stopListen(),render()):startListen()},
 vspeak:()=>{ui.voice.speak=!ui.voice.speak;saveVoice();render();if(ui.voice.speak)speak('Czytanie wyniku włączone')},
 pcdel:d=>ask('pdc'+d.id,()=>{if(ui.setup.a===d.id)ui.setup.a=null;if(ui.setup.b===d.id)ui.setup.b=null;saveUi();del('players',d.id);toast('Gracz usunięty. Jego mecze zostają w historii.')}),
 pdel:()=>ask('pdel',()=>{const id=ui.edit.id;ui.edit=null;ui.prof=null;if(ui.setup.a===id)ui.setup.a=null;if(ui.setup.b===id)ui.setup.b=null;saveUi();del('players',id)})
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const f=H[el.dataset.act];if(f)f(el.dataset)});
document.addEventListener('input',e=>{
  if(e.target.id==='p-name'&&ui.edit)ui.edit.name=e.target.value;
  if(e.target.id==='t-name')ui.tsetup.name=e.target.value});
document.addEventListener('change',e=>{
  if(e.target.id==='imp'){importData(e.target.files[0]);e.target.value='';return}
  const k=e.target.dataset&&e.target.dataset.chg;if(!k)return;const v=e.target.value;
  if(k==='period')ui.period=v;if(k==='hf')ui.hf=v;if(k==='h2ha')ui.h2h.a=v;if(k==='h2hb')ui.h2h.b=v;render()});
document.addEventListener('keydown',e=>{
  if(ui.tab!=='play'||!ui.live||/INPUT|SELECT|TEXTAREA/.test((e.target||{}).tagName||''))return;
  const left=ui.live.flip?'B':'A',right=ui.live.flip?'A':'B';
  if(e.key==='ArrowLeft'){e.preventDefault();addPoint(left)}
  if(e.key==='ArrowRight'){e.preventDefault();addPoint(right)}});

render();initStore();
})();
</script>
</body>
</html>
